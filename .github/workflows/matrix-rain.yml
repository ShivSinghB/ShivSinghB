name: Generate Matrix Rain
on:
  schedule:
    - cron: '*/30 * * * *'  # Every 30 minutes
  push:
    branches: [ main ]

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Platane/snk@v3
        with:
          github_user_name: ShivSinghB
          outputs: |
            assets/matrix-rain.mp4?palette=github_dark&color_snake=00ff41&color_dots=#151515,#00ff41,#39ff14,#00ff41
      - uses: actions/upload-artifact@v3
        with:
          name: matrix-rain
          path: assets/matrix-rain.mp4