name: Generate Holographic Profile Card
on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate holographic card
        uses: jamesgeorge007/github-activity-readme@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          COMMIT_MSG: "Update holographic presence"
          MAX_LINES: 10
      - name: Create holographic card
        run: |
          curl -s "https://holo-card.vercel.app/api/card?username=ShivSinghB&theme=cyberpunk&stats=stars,followers,commits&animation=hologram" > assets/holographic-card.png
      - uses: actions/upload-artifact@v3
        with:
          path: assets/holographic-card.png